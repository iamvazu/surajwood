version: "3.8"

services:
  surajwood-wa-agent:
    build: .
    container_name: surajwood-wa-agent
    restart: always
    ipc: host
    shm_size: "2gb"
    ports:
      - "3005:3005"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PORT=3005
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.surajwood-wa-http.entrypoints=web"
      - "traefik.http.routers.surajwood-wa-http.rule=Host(`wa.srv1566293.hstgr.cloud`) || Host(`surajwood-wa.srv1566293.hstgr.cloud`) || Host(`wa.surajwood.com`)"
      - "traefik.http.routers.surajwood-wa.entrypoints=websecure"
      - "traefik.http.routers.surajwood-wa.rule=Host(`wa.srv1566293.hstgr.cloud`) || Host(`surajwood-wa.srv1566293.hstgr.cloud`) || Host(`wa.surajwood.com`)"
      - "traefik.http.routers.surajwood-wa.tls=true"
      - "traefik.http.routers.surajwood-wa.tls.certresolver=letsencrypt"
      - "traefik.http.services.surajwood-wa.loadbalancer.server.port=3005"
